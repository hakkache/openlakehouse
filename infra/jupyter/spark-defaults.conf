# Spark client configuration for the Jupyter notebook environment.
# Mirrors infra/spark/spark-defaults.conf but adds driver settings so that
# interactive SparkSession.builder.getOrCreate() calls (no --master flag)
# connect to the real standalone cluster instead of running locally.

spark.master                                            spark://spark-master:7077
spark.driver.host                                       jupyter
spark.driver.bindAddress                                0.0.0.0

spark.eventLog.enabled                                 true
spark.eventLog.dir                                      file:///opt/spark/spark-events
spark.history.fs.logDirectory                           file:///opt/spark/spark-events

spark.jars.packages                                     org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.apache.iceberg:iceberg-aws-bundle:1.6.1

spark.sql.extensions                                    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

spark.sql.catalog.catalog                               org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.catalog.type                          rest
spark.sql.catalog.catalog.uri                           http://polaris:8181/api/catalog
spark.sql.catalog.catalog.warehouse                     lakehouse
spark.sql.catalog.catalog.credential                    root:polaris_dev_secret
spark.sql.catalog.catalog.scope                         PRINCIPAL_ROLE:ALL
spark.sql.catalog.catalog.token-refresh-enabled         true
spark.sql.catalog.catalog.header.X-Iceberg-Access-Delegation    vended-credentials

spark.sql.defaultCatalog                                catalog
