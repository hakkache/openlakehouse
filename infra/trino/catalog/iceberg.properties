# Trino Iceberg catalog wired to the Polaris REST catalog, backed by MinIO.
# Mirrors the same catalog wiring used by the Spark cluster (infra/spark/spark-defaults.conf).
#
# vended-credentials-enabled=true means Polaris hands Trino short-lived S3
# credentials per request, but Trino still needs its native S3 filesystem
# module enabled to know how to read s3:// locations at all.

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=lakehouse
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=root:polaris_dev_secret
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.vended-credentials-enabled=true

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin123
